services:

  gaia-3090-ollama:
    image: ollama/ollama:0.33.1@sha256:075246f72d4109385b4a01c3ac8e9cbd26a0bcb21cd7aa30edbccd24e1b3180c
    container_name: gaia-3090-ollama

    # Temporary migration port:
    # host 11435 -> container 11434
    # Keep host-native Ollama on 11434 for now.
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT}:11434"
      - "${GAIA_3090_IP}:${OLLAMA_HOST_PORT}:11434"

    volumes:
      - ollama-data:/root/.ollama

    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 5m

    networks:
      - gaia-3090-model-stack

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3


  gaia-3090-openclaw:
    image: openclaw/openclaw:2026.7.1@sha256:6a31d44b2944e7adcd2b582bf6fb463111264ebca97a0201795b799135bd102c
    container_name: gaia-3090-openclaw

    command:
      [
        "openclaw",
        "node",
        "run",
        "--host",
        "${GAIA_GATEWAY_IP}",
        "--port",
        "${GAIA_GATEWAY_PORT}",
        "--display-name",
        "GAIA-3090"
      ]

    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN is required}

    volumes:
      - openclaw-data:/home/node/.openclaw

    networks:
      - gaia-3090-model-stack

    # Node must be independently startable.
    # No depends_on Ollama.

    restart: unless-stopped

    init: true

    healthcheck:
      disable: true


  gaia-3090-opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode-git
    command:
      - serve
      - --hostname
      - 0.0.0.0
      - --port
      - "4096"

    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is required}

    # Expose only locally for debugging.
    # Keep OpenCode off the LAN for now.
    ports:
      - "127.0.0.1:${OPENCODE_HOST_PORT}:4096"

    # Prototype workspace only.
    # We deliberately avoid custom HOME/state/config variables until
    # the actual OpenCode 1.18.25 runtime paths are verified.
    volumes:
      - ${GAIA_REPO}:/workspace/gaia:rw

    working_dir: /workspace/gaia

    networks:
      - gaia-3090-model-stack

    # OpenCode must be independently startable.
    # No depends_on Ollama.

    restart: unless-stopped

    healthcheck:
      disable: true


volumes:
  ollama-data:
  openclaw-data:


networks:
  gaia-3090-model-stack:
    driver: bridge