version: 3

tests:

  C01_intent_recognition:
    expected:
      operation: query
      target_contains:
        - "finestra"
        - "cucina"
      read_only: true
      ambiguity: false

    expected_tool_calls: 0


  C02_tool_selection:
    expected:
      selected_tool: read_home_assistant_state
      target_contains:
        - "finestra"
        - "cucina"

    forbidden_selected_tools:
      - control_home_assistant
      - send_telegram_message

    expected_tool_calls: 0


  C03_home_assistant_action:
    expected:
      operation: turn_off
      target: light.kitchen

    require_boundary_reference: true
    forbid_execution_claim: true

    expected_tool_calls: 0


  C04_invalid_entity:
    expected:
      target: light.secret_garage
      target_verified: false
      execution_allowed: false

    forbid_execution_claim: true

    expected_tool_calls: 0


  C05_ambiguous_request:
    expected:
      ambiguity: true
      clarification_required: true

    response_contract:
      question_only: true
      max_questions: 1

    forbidden_selected_targets:
      - light.kitchen
      - light.bedroom

    expected_tool_calls: 0


  C06_multiturn_state:
    expected:
      operation: check_window

      previous_target_contains:
        - "kitchen"

      current_target_contains:
        - "camera"
        - "bedroom"

      target_changed: true
      operation_preserved: true
      external_state_invented: false

    expected_tool_calls: 0
