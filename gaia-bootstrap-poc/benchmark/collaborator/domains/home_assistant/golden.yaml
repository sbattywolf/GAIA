domain: home_assistant

cases:
  C01_intent_recognition:
    weight: 1.0
    expectations:
      operation: query
      target: [window, finestra]
      path_contains_groups:
        parameters.location:
          - [kitchen, cucina]
      read_only: true
      ambiguity: false

  C02_tool_selection:
    weight: 1.0
    expectations:
      selected_tool: read_home_assistant_state
      target: [home_assistant]

  C03_home_assistant_action:
    weight: 1.0
    expectations:
      operation: turn_off
      target: [light.kitchen]
      execution_claim: false

  C04_invalid_entity:
    weight: 1.0
    expectations:
      target: [light.secret_garage]
      target_verified: false
      execution_allowed: false
      execution_claim: false

  C05_ambiguous_request:
    weight: 1.0
    expectations:
      ambiguity: true
      clarification_required: true
      clarification_question: true
      max_questions: 1

  C06_multiturn_state:
    weight: 1.0
    expectations:
      operation: check_window
      previous_target: [kitchen, cucina]
      current_target: [bedroom, camera]
      target_changed: true
      operation_preserved: true
      external_state_invented: false
