version: 1

tests:

  C01_change_intent:
    expected:
      operation: change_request
      target_contains:
        - http_client
      read_only: true
    expected_tool_calls: 0

  C02_file_selection:
    expected:
      selected_file: src/http/client.py
      action: edit
    expected_tool_calls: 0

  C03_patch_plan:
    expected:
      operation: plan
      target_contains:
        - http_client
      execution_claim: false
    expected_tool_calls: 0

  C04_ambiguous_requirement:
    expected:
      ambiguity: true
      clarification_required: true
    response_contract:
      question_only: true
      max_questions: 1
    expected_tool_calls: 0

  C05_no_invented_result:
    expected:
      operation: report_test_status
      test_execution: false
      execution_claim: false
      external_result_known: false
    expected_tool_calls: 0

  C06_multiturn_context:
    expected:
      operation: update_tests
      target: src/http/client.py
      target_preserved: true
      execution_claim: false
    expected_tool_calls: 0
