services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    privileged: true
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "0.0.0.0:11434:11434"  # 🚨 IMPONE A DOCKER DI APRIRE LA PORTA SU TUTTI GLI IP FISICI DELLA MACCHINA
    environment:
      - OLLAMA_HOST=0.0.0.0 
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 5

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui_data:/app/backend/data
      - /home/sbatta/raspberry_config:/app/backend/data/raspberry_config:ro
    restart: always

  # 🎙️ SPEECH-TO-TEXT: Riconoscimento Vocale (Whisper) indipendente in Docker
  wyoming-whisper:
    image: rhasspy/wyoming-whisper:latest
    container_name: wyoming-whisper
    network_mode: host
    command: --model base --language it
    volumes:
      - wyoming_data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always

  wyoming-piper:
    image: rhasspy/wyoming-piper:latest
    container_name: wyoming-piper
    network_mode: host
    privileged: true
    command: --voice it_IT-riccardo-x_low --data-dir /data
    volumes:
      - wyoming_data:/data
    restart: always

#  n8n:
#    image: n8nio/n8n:latest
#    container_name: n8n
#    network_mode: host
#    environment:
#      - N8N_SECURE_COOKIE=false
#    volumes:
#      - n8n_data:/home/node/.n8n
#    restart: always
  glances:
    image: nicolargo/glances:latest
    container_name: glances
    network_mode: host  # 🚨 APRE LA PORTA 61208 DIRETTAMENTE SU UBUNTU SENZA FILTRI
    pid: host
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GLANCES_OPT=-w
    restart: always

volumes:
  ollama_data:
  open-webui_data:
  wyoming_data:
#  n8n_data:

