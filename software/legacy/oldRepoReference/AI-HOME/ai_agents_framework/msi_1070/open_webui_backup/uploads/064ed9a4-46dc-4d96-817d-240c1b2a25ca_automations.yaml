- id: '1784991096294'
  alias: 'IA: Report Serale Dinamico Autogestito'
  description: Genera un report analizzando automaticamente tutte le entità attive
    della casa
  triggers:
  - at: '23:00:00'
    trigger: time
  conditions: []
  actions:
  - action: conversation.process
    metadata: {}
    data:
      agent_id: conversation.agente_iot_1070
      text: "Genera un report serale di sicurezza conciso per Sbatta in italiano perfetto.
        Analizza questa lista di dispositivi attualmente ATTIVI (accesi o aperti)
        nella casa ed elenca solo le anomalie reali o le cose dimenticate accese.
        Se tutto è spento e chiuso, dì che la casa è in totale sicurezza.\nEcco i
        dispositivi attivi adesso: {% set luci = states.light | selectattr('state',
        'eq', 'on') | rejectattr('entity_id', 'search', 'adaptive_lighting') | map(attribute='entity_id')
        | list %} {% set interruttori = states.switch | selectattr('state', 'eq',
        'on') | rejectattr('entity_id', 'search', 'always_on|adaptive_lighting|sleep_mode|adapt_color|power_outage|autofocus|alarm|infrared|cammela')
        | map(attribute='entity_id') | list %} {% set porte_finestre = states.binary_sensor
        | selectattr('state', 'eq', 'on') | list %}\n\nLUCI ACCESE: {% if luci | length
        > 0 %}\n  {% for l in luci %} - {{ state_attr(l, 'friendly_name') or l }}\n
        \ {% endfor %}\n{% else %}\n  Nessuna luce accesa.\n{% endif %}\nPRESE/INTERRUTTORI
        ATTIVI: {% if interruttori | length > 0 %}\n  {% for i in interruttori %}
        - {{ state_attr(i, 'friendly_name') or i }}\n  {% endfor %}\n{% else %}\n
        \ Nessuna presa attiva.\n{% endif %}\nPORTE E FINESTRE APERTE: {% if porte_finestre
        | length > 0 %}\n  {% for pf in porte_finestre %} - {{ pf.name }}\n  {% endfor
        %}\n{% else %}\n  Tutto chiuso.\n{% endif %}\n"
    response_variable: riscontro_ia
  - action: notify.persistent_notification
    data:
      title: Report Sicurezza (GTX 1070)
      message: '{{ riscontro_ia.response.speech.plain.speech }}'
  mode: single
