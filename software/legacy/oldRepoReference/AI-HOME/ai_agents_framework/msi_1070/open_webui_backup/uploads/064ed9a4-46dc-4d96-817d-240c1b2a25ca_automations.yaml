- id: '1636578784463'
  alias: Move Detection Camera da Letto Night
  description: ''
  triggers:
  - type: occupied
    device_id: 7dd107de814b90f09bc69099365f5eb6
    entity_id: 9fbce405a3af200ad70d931f5c207cd1
    domain: binary_sensor
    id: Start presence back
    trigger: device
    enabled: false
  - type: occupied
    device_id: 7dd107de814b90f09bc69099365f5eb6
    entity_id: 61d88f25096ada213bdc3c523d40be42
    domain: binary_sensor
    id: Start presence bed
    trigger: device
    enabled: false
  - type: not_occupied
    device_id: 7dd107de814b90f09bc69099365f5eb6
    entity_id: 9fbce405a3af200ad70d931f5c207cd1
    domain: binary_sensor
    id: Stop presence bed
    trigger: device
    enabled: false
  - type: not_occupied
    device_id: 7dd107de814b90f09bc69099365f5eb6
    entity_id: 9fbce405a3af200ad70d931f5c207cd1
    domain: binary_sensor
    id: Stop presence bed 5m
    for:
      hours: 0
      minutes: 5
      seconds: 0
    trigger: device
    enabled: false
  - type: not_occupied
    device_id: 7dd107de814b90f09bc69099365f5eb6
    entity_id: 44bb0340de2e69060b906af1e74003ab
    domain: binary_sensor
    id: Stop presence all
    for:
      hours: 0
      minutes: 5
      seconds: 0
    trigger: device
    enabled: false
  - type: turned_off
    device_id: fa8161621e69c000853fdf68dc0d5bf4
    entity_id: 7c5ed6a3bea3e339c6eaedeb870eb671
    domain: light
    id: Switch off bed light
    trigger: device
  - type: turned_on
    device_id: fa8161621e69c000853fdf68dc0d5bf4
    entity_id: 7c5ed6a3bea3e339c6eaedeb870eb671
    domain: light
    trigger: device
    id: Switch on bed light
  - trigger: time
    at: 08:00:00
    id: Sunrise
  conditions:
  - condition: time
    after: '23:00:00'
    before: '10:30:00'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Start presence bed
      sequence:
      - action: counter.increment
        metadata: {}
        data: {}
        target:
          entity_id: counter.paxbed
      - type: turn_off
        device_id: ac6618018658b36ec93b4d81a86257eb
        entity_id: 53fc921b50463852285f469ade8bb491
        domain: switch
      - data:
          transition: 10
          brightness_step_pct: 70
          kelvin: 3206
        target:
          entity_id:
          - light.luce_yeelink_bedside_lamp_light
        action: light.turn_on
      - data:
          rgb_color:
          - 0
          - 128
          - 0
          transition: 10
          brightness_pct: 45
        target:
          entity_id:
          - light.nanoleaf_light_strip
        action: light.turn_on
    - conditions:
      - condition: trigger
        id:
        - Start presence back
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: counter.paxbed
          below: 1
        - condition: state
          entity_id: binary_sensor.presence_sensor_camera_bed_presence
          state: 'off'
          for:
            hours: 0
            minutes: 5
            seconds: 0
          enabled: true
      sequence:
      - action: counter.decrement
        target:
          entity_id: counter.paxbed
        data: {}
      - type: turn_on
        device_id: ac6618018658b36ec93b4d81a86257eb
        entity_id: 53fc921b50463852285f469ade8bb491
        domain: switch
    - conditions:
      - condition: trigger
        id:
        - Start presence back
      - condition: state
        entity_id: binary_sensor.presence_sensor_camera_bed_presence
        state: 'off'
        for:
          hours: 0
          minutes: 0
          seconds: 0
        enabled: true
      sequence:
      - action: counter.decrement
        target:
          entity_id:
          - counter.paxbed
        data: {}
      - if:
        - condition: state
          entity_id: light.nanoleaf_light_strip
          state: unavailable
        then: []
        else:
        - data:
            rgb_color:
            - 0
            - 128
            - 0
            transition: 10
            brightness_pct: 10
          target:
            entity_id:
            - light.nanoleaf_light_strip
          action: light.turn_on
      - data:
          transition: 10
          brightness_pct: 2
          brightness_step_pct: 25
        target:
          entity_id:
          - light.luce_yeelink_bedside_lamp_light
        action: light.turn_on
      - delay:
          hours: 0
          minutes: 2
          seconds: 0
          milliseconds: 0
      - repeat:
          count: 3
          sequence:
          - if:
            - condition: state
              entity_id: binary_sensor.sensore_movimento_letto_occupancy
              state: 'off'
              for:
                hours: 0
                minutes: 0
                seconds: 30
            - condition: state
              entity_id: input_boolean.keep_on_light_bed
              state: 'off'
            then:
            - data: {}
              target:
                entity_id:
                - light.nanoleaf_light_strip
                - light.luce_yeelink_bedside_lamp_light
              action: light.turn_off
          - if:
            - condition: state
              entity_id: light.nanoleaf_light_strip
              state: 'on'
            then:
            - delay:
                hours: 0
                minutes: 2
                seconds: 0
                milliseconds: 0
      - if:
        - condition: state
          entity_id: input_boolean.keep_on_light_bed
          state: 'off'
        - condition: or
          conditions:
          - condition: state
            entity_id: light.nanoleaf_light_strip
            state: 'on'
          - condition: state
            entity_id: light.luce_yeelink_bedside_lamp_light
            state: 'on'
        then:
        - data: {}
          target:
            entity_id:
            - light.nanoleaf_light_strip
            - light.luce_yeelink_bedside_lamp_light
          action: light.turn_off
    - conditions:
      - condition: trigger
        id:
        - Stop presence all
      sequence:
      - type: turn_off
        device_id: ac6618018658b36ec93b4d81a86257eb
        entity_id: 53fc921b50463852285f469ade8bb491
        domain: switch
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          device_id: fa8161621e69c000853fdf68dc0d5bf4
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          device_id:
          - fa8161621e69c000853fdf68dc0d5bf4
          - 1de01d10689df0229a947b42bb003fc1
    - conditions:
      - condition: trigger
        id:
        - Switch off bed light
      sequence:
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          device_id: ac6618018658b36ec93b4d81a86257eb
      - type: turn_off
        device_id: 1de01d10689df0229a947b42bb003fc1
        entity_id: bd08f5b01c57af269faebb2c9f89c5a6
        domain: light
    - conditions:
      - condition: trigger
        id:
        - Switch on bed light
      sequence:
      - type: turn_on
        device_id: 184b6a6ebc2040cc5ec4917607ad2fe2
        entity_id: 29a9635c014ea45589b2136df1c3b36e
        domain: switch
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          device_id: ac6618018658b36ec93b4d81a86257eb
      - type: turn_on
        device_id: 1de01d10689df0229a947b42bb003fc1
        entity_id: bd08f5b01c57af269faebb2c9f89c5a6
        domain: light
      - type: turn_off
        device_id: f03abd08af7fdd093d08eb454041e468
        entity_id: dc50fef83aa9d9183e53c3d78b8491e4
        domain: light
    - conditions:
      - condition: trigger
        id:
        - Sunrise
      sequence:
      - type: turn_off
        device_id: 184b6a6ebc2040cc5ec4917607ad2fe2
        entity_id: 29a9635c014ea45589b2136df1c3b36e
        domain: switch
  mode: single
