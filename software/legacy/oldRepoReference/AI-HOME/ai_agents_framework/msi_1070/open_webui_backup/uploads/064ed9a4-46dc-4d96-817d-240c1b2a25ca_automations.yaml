- id: '1702130464459'
  alias: Switch on/off LITTLE BEAST PC
  description: ''
  triggers:
  - entity_id:
    - device_tracker.pc_little_beast
    id: pc offline
    trigger: state
    to:
    - not_home
    for:
      hours: 1
      minutes: 0
      seconds: 0
  - entity_id:
    - switch.plug_sim_racing
    id: Switch On SimPlug
    trigger: state
    to: 'on'
    enabled: true
  - entity_id:
    - switch.plug_sim_racing
    id: Switch Off SimPlug
    trigger: state
    to: 'off'
    enabled: true
  - entity_id:
    - sensor.little_beast_simracing_little_beast_simracing_loggeduser
    id: Ayrton ON
    trigger: state
    to:
    - Ayrton
  - entity_id:
    - sensor.little_beast_simracing_little_beast_simracing_loggeduser
    id: Ayrton Off
    trigger: state
    from:
    - Ayrton
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Switch On SimPlug
      sequence:
      - if:
        - condition: state
          entity_id: sensor.laptopbeasthassmqtt_battery_powerline_status
          state:
          - 'off'
        then:
        - action: switch.turn_on
          metadata: {}
          target:
            device_id: 444adb213ba4fcb3e902f336ad28c0b0
          data: {}
        - delay:
            hours: 0
            minutes: 0
            seconds: 20
            milliseconds: 0
      - if:
        - condition: state
          entity_id: switch.plug_pc_little_beast_presa_1
          state:
          - 'off'
        then:
        - action: switch.turn_on
          metadata: {}
          target:
            entity_id:
            - switch.plug_pc_little_beast_presa_1
          data: {}
      - if:
        - condition: state
          entity_id: media_player.sony_xr_83a90j_4
          state: 'off'
        then:
        - type: turn_on
          device_id: a1e7d3601393a6be747a474892a2cb15
          entity_id: ab0edb3fba5d269e18d2429fac0c9884
          domain: remote
    - conditions:
      - condition: trigger
        id:
        - Switch Off SimPlug
      sequence:
      - action: button.press
        metadata: {}
        target:
          entity_id: button.little_beast_simracing_little_beast_simracing_logoff
        data: {}
    - conditions:
      - condition: trigger
        id:
        - Ayrton ON
      - condition: state
        entity_id: sensor.little_beast_simracing_little_beast_simracing_loggeduser
        state:
        - Ayrton
        enabled: false
      sequence:
      - if:
        - condition: state
          entity_id: switch.plug_sim_racing
          state:
          - 'off'
        then:
        - type: turn_on
          device_id: d7114f6ddbfde93b256b5050a9b692d8
          entity_id: de1cf524f7fe1090671be477c36b1335
          domain: switch
      - if:
        - condition: state
          entity_id: media_player.sony_xr_83a90j_4
          state: 'off'
        then:
        - type: turn_on
          device_id: a1e7d3601393a6be747a474892a2cb15
          entity_id: ab0edb3fba5d269e18d2429fac0c9884
          domain: remote
    - conditions:
      - condition: trigger
        id:
        - Ayrton Off
        enabled: false
      - condition: state
        entity_id: sensor.little_beast_simracing_little_beast_simracing_loggeduser
        state:
        - Ayrton
        enabled: false
      sequence:
      - type: turn_off
        device_id: d7114f6ddbfde93b256b5050a9b692d8
        entity_id: de1cf524f7fe1090671be477c36b1335
        domain: switch
        enabled: false
    - conditions:
      - condition: and
        conditions:
        - condition: trigger
          id:
          - pc offline
        - condition: state
          entity_id: sensor.little_beast_sbatt_loggeduser
          state:
          - unavailable
        - condition: state
          entity_id: sensor.little_beast_simracing_little_beast_simracing_loggeduser
          state:
          - unavailable
        enabled: false
      sequence:
      - type: turn_off
        device_id: 0363ec6259e045f90d35249bb64606e9
        entity_id: aeb8b5ddcf1df9e1a0b0475d4007f65a
        domain: switch
  mode: single
