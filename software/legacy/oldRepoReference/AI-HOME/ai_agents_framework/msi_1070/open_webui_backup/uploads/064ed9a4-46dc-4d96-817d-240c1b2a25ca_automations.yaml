- id: '1638308320252'
  alias: Switch on/off Bagno Lock
  description: ''
  trigger:
  - platform: state
    entity_id:
    - switch.wall_switch_bagno_lock_switch
    from: 'off'
    to: 'on'
    id: switch_bagno_lock_on
  - platform: state
    entity_id:
    - switch.wall_switch_bagno_lock_switch
    from: 'on'
    to: 'off'
    id: switch_bagno_lock_off
  - platform: state
    entity_id:
    - switch.wall_switch_bagno_switch
    from: 'on'
    to: 'off'
    id: switch_bagno_off
  - platform: state
    entity_id:
    - input_boolean.keep_on_light_bath
    from: 'off'
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: keep_on_light_on
  - platform: state
    entity_id:
    - input_boolean.keep_on_light_bath
    to: 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: keep_on_light_off
    from: 'on'
  - platform: numeric_state
    entity_id: sensor.sensore_meteo_bagno_humidity
    above: 79.8
    id: humidity_up
    for:
      hours: 0
      minutes: 2
      seconds: 0
  - platform: numeric_state
    entity_id:
    - sensor.sensore_meteo_bagno_humidity
    id: humidity_down
    for:
      hours: 0
      minutes: 2
      seconds: 0
    below: '70'
  - platform: numeric_state
    entity_id:
    - sensor.variazione_umidita_bagno
    id: humidity_perc_down
    for:
      hours: 0
      minutes: 0
      seconds: 0
    below: -150
  condition: []
  action:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - switch_bagno_lock_on
      sequence:
      - if:
        - condition: device
          type: is_off
          device_id: 8e1c17930fc905b37432f27fa610b7fb
          entity_id: 9fd1cae2c2c94979acfdaeac370bb4a6
          domain: switch
        then:
        - data: {}
          target:
            entity_id: switch.wall_switch_bagno_switch
          action: switch.turn_on
      - target:
          entity_id: input_boolean.keep_on_light_bath
        data: {}
        action: input_boolean.turn_on
    - conditions:
      - condition: trigger
        id:
        - switch_bagno_lock_off
      sequence:
      - if:
        - condition: device
          type: is_on
          device_id: 8e1c17930fc905b37432f27fa610b7fb
          entity_id: 9fd1cae2c2c94979acfdaeac370bb4a6
          domain: switch
        then:
        - data: {}
          target:
            entity_id: switch.wall_switch_bagno_switch
          action: switch.turn_off
      - target:
          entity_id: input_boolean.keep_on_light_bath
        data: {}
        enabled: true
        action: input_boolean.turn_off
    - conditions:
      - condition: trigger
        id:
        - switch_bagno_off
      sequence:
      - target:
          entity_id: input_boolean.keep_on_light_bath
        data: {}
        enabled: true
        action: input_boolean.turn_off
      - if:
        - condition: device
          type: is_on
          device_id: 8e1c17930fc905b37432f27fa610b7fb
          entity_id: 774f003c79b3ebfd577ad7bc23bfba9e
          domain: switch
        then:
        - data: {}
          target:
            entity_id: switch.wall_switch_bagno_lock_switch
          action: switch.turn_off
    - conditions:
      - condition: trigger
        id:
        - keep_on_light_off
      sequence:
      - data: {}
        target:
          entity_id:
          - switch.wall_switch_bagno_switch
          - switch.wall_switch_bagno_lock_switch
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id:
        - keep_on_light_on
      sequence:
      - if:
        - condition: device
          type: is_off
          device_id: 8e1c17930fc905b37432f27fa610b7fb
          entity_id: 9fd1cae2c2c94979acfdaeac370bb4a6
          domain: switch
        then:
        - data: {}
          target:
            entity_id: switch.wall_switch_bagno_switch
          action: switch.turn_on
      - if:
        - condition: device
          type: is_off
          device_id: 8e1c17930fc905b37432f27fa610b7fb
          entity_id: 774f003c79b3ebfd577ad7bc23bfba9e
          domain: switch
        then:
        - data: {}
          target:
            entity_id:
            - switch.wall_switch_bagno_lock_switch
          action: switch.turn_on
    - conditions:
      - condition: trigger
        id:
        - humidity_up
      sequence:
      - choose:
        - conditions:
          - condition: device
            type: is_off
            device_id: 8e1c17930fc905b37432f27fa610b7fb
            entity_id: 774f003c79b3ebfd577ad7bc23bfba9e
            domain: switch
          sequence:
          - data: {}
            target:
              entity_id: switch.wall_switch_bagno_lock_switch
            action: switch.turn_on
    - conditions:
      - condition: trigger
        id:
        - humidity_down
        - humidity_perc_down
      sequence:
      - if:
        - condition: state
          entity_id: binary_sensor.sensore_movimento_bagno_occupancy
          state: 'off'
          for:
            hours: 0
            minutes: 2
            seconds: 0
        then:
        - data: {}
          target:
            entity_id:
            - switch.wall_switch_bagno_switch
          action: switch.turn_off
  mode: single
